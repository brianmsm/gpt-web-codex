name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate launcher installer with Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            throw "Expected Windows PowerShell 5.1, got $($PSVersionTable.PSVersion)"
          }
          $source = Get-Content scripts/install-launcher.ps1 -Raw
          [void][scriptblock]::Create($source)
          if (-not [Environment]::Is64BitOperatingSystem) {
            throw "The Windows CI runner must be 64-bit"
          }
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install root dependencies with one network retry
        run: bun install --frozen-lockfile || bun install --frozen-lockfile
      - name: Install launcher dependencies with one network retry
        run: bun install --frozen-lockfile || bun install --frozen-lockfile
        working-directory: launcher
      - name: Prepare AVX2-independent Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/prepare-windows-baseline-bun.ps1 -Version 1.3.14 -GitHubEnv $env:GITHUB_ENV
      - run: bun run verify
      - name: Test draft release safety offline
        if: runner.os == 'Linux'
        run: |
          python3 -B -m unittest discover -s tests -p 'test_release_build_identity.py' -q
          python3 -B -m unittest discover -s tests -p 'test_stage_release_draft.py' -q
      - run: bun run app:package
      - name: Ensure virtual display is available
        if: runner.os == 'Linux'
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
      - run: bun run app:smoke

  # Temporary diagnostic only: compare Bun's Windows stdio/process behavior
  # under the SAME hosted runner and the SAME synthetic GWC policy tests.
  # Remove this job after deciding whether a runtime update is justified.
  windows-stdio-runtime-ab:
    name: Windows stdio runtime A/B (Bun ${{ matrix.bun }})
    runs-on: windows-latest
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        bun: ["1.3.14", "1.4.0"]
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile || bun install --frozen-lockfile
      - name: Probe nested Bun-to-Windows PowerShell process startup
        shell: pwsh
        run: |
          $BunExe = (Get-Command bun -ErrorAction Stop).Source
          node tests/fixtures/windows-nested-process-probe.mjs $BunExe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test direct Node client with Bun GWC server (no Bun test worker)
        shell: pwsh
        run: |
          $BunExe = (Get-Command bun -ErrorAction Stop).Source
          $Cli = Join-Path $PWD "src/cli.ts"
          node tests/fixtures/windows-stdio-node-terminal.mjs $BunExe $Cli ownership
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/fixtures/windows-stdio-node-terminal.mjs $BunExe $Cli exec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Reproduce nested interactive PowerShell/stdin ownership
        shell: pwsh
        run: bun test --timeout 30000 --test-name-pattern "direct terminal jobs are isolated by authoritative web session ownership" tests/standalone-luna.test.ts
      - name: Reproduce nested one-shot terminal_exec
        shell: pwsh
        run: bun test --timeout 30000 --test-name-pattern "standalone MCP exposes Luna direct and Herdr tools without a turn broker" tests/standalone-luna.test.ts

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false
      - name: Lint GitHub Actions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -config-file .github/actionlint.yaml .github/workflows/*.yml
